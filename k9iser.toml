# k9iser manifest — wrap configs into self-validating K9 contracts
# SPDX-License-Identifier: MPL-2.0
#
# kea: orchestration and deployment controller — bivouac (Rust) + mandible.
# Infrastructure tooling with mTLS, zero-trust, and playbook-driven automation.
# Safety-tier "yard" — infrastructure, moderate scrutiny.

[project]
name = "kea"
safety-tier = "yard"  # infrastructure orchestration

# ── bivouac/Cargo.toml — orchestration controller ────────────────────────────

[[configs]]
name = "bivouac-cargo"
source = "bivouac/Cargo.toml"
format = "toml"
must = [
  "package.name == 'kea-bivouac'",
  "package.edition == '2021'",
  "package.license == 'MPL-2.0'",
  "package.repository is non-empty",
  "dependencies.tokio is set",                          # async runtime required
  "dependencies.rustls is set",                         # TLS required (mTLS)
  "dependencies.tokio-rustls is set",
  "dependencies.tracing is set",                        # structured logging required
  "profile.release.lto == true",                        # LTO for release binary
  "profile.release.strip == true",
]
trust = ["signed-by: ci-pipeline"]
dust = []
intend = ["production-ready"]

# ── bivouac/playbooks/failover.toml — automated failover playbook ─────────────

[[configs]]
name = "playbook-failover"
source = "bivouac/playbooks/failover.toml"
format = "toml"
must = [
  "name == 'failover'",
  "version is set",
  "timeout_secs > 0",                                   # timeout must be positive
  "timeout_secs <= 3600",                               # timeout <= 1 hour (sanity)
  "trigger.type == 'health-check-failure'",
  "trigger.service is non-empty",
  "actions[0].type is set",                             # at least one action required
]
trust = ["signed-by: ci-pipeline"]
dust = []
intend = ["operational-ready"]

# ── bivouac/playbooks/integrity-violation.toml — integrity response playbook ──

[[configs]]
name = "playbook-integrity-violation"
source = "bivouac/playbooks/integrity-violation.toml"
format = "toml"
must = [
  "name == 'integrity-violation'",
  "version is set",
  "continue_on_error == false",                         # halt on integrity violation
  "timeout_secs > 0",
  "timeout_secs <= 3600",
  "trigger.type == 'integrity-violation'",
  "trigger.severity == 'critical'",                     # only critical triggers response
  "actions[0].type is set",
]
trust = ["signed-by: ci-pipeline"]
dust = []
intend = ["operational-ready", "security-critical"]

# ── stapeln.toml — container layer build ─────────────────────────────────────

[[configs]]
name = "container-build"
source = "stapeln.toml"
format = "toml"
must = [
  "metadata.license == 'MPL-2.0'",
  "metadata.registry == 'ghcr.io/hyperpolymath'",
  "build.runtime == 'podman'",
  "layers.base.from starts-with 'cgr.dev/chainguard/'",
  "layers.base.verify == true",
  "layers.runtime.user == 'nonroot'",
  "security.non-root == true",
  "security.no-new-privileges == true",
  "security.cap-drop contains 'ALL'",
  "security.signing.algorithm == 'ML-DSA-87'",
  "security.signing.provider == 'cerro-torre'",
  "security.sbom.format == 'spdx-json'",
  "verify.vordr == true",
  "verify.svalinn == true",
  "verify.scan-on-build == true",
  "verify.fail-on contains 'critical'",
  "verify.fail-on contains 'high'",
]
trust = ["signed-by: ci-pipeline"]
dust = []
intend = ["production-ready", "supply-chain-verified"]

[validation]
strict = true
auto-fix = false
report-format = "text"
